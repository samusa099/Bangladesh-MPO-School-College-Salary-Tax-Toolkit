name: Publish Repository Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: read

concurrency:
  group: publish-wiki-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    name: Sync wiki to GitHub Wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail
          test -f wiki/Home.md
          test -f wiki/_Sidebar.md
          find wiki -maxdepth 1 -type f -name '*.md' -print | sort

      - name: Check Wiki publishing credentials
        id: wiki_credentials
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [[ -n "${WIKI_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Wiki publication skipped::WIKI_TOKEN is not configured. Source validation passed, but publishing to the GitHub Wiki was skipped."
          fi

      - name: Publish Wiki pages
        if: steps.wiki_credentials.outputs.available == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git"
          git clone "${wiki_url}" wiki-publish

          find wiki-publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp wiki/*.md wiki-publish/

          cd wiki-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Wiki is already synchronized."
            exit 0
          fi

          git commit -m "docs: sync Wiki from root wiki folder"
          git push origin master

# Token-enabled publish verification: 2026-08-05
