name: Reconcile Release Tag Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-release-tag-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    name: Retag v0.1.3 release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reconcile tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: '370129888'
          RULESET_ID: '20394694'
          OLD_TAG: 'v2'
          NEW_TAG: 'v0.1.3'
          RELEASE_NAME: 'Bangladesh MPO School & College Salary Tax Toolkit v0.1.3 Beta'
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          admin_auth=(-H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          if [[ -z "${ADMIN_TOKEN}" ]]; then
            echo "::error::WIKI_TOKEN is not configured; cannot temporarily adjust the tag ruleset."
            exit 1
          fi

          echo "Verify canonical ${NEW_TAG} and release are already aligned."
          new_ref_json="$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${NEW_TAG}")"
          new_sha="$(jq -r '.object.sha' <<<"${new_ref_json}")"
          old_ref_json="$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${OLD_TAG}")"
          old_sha="$(jq -r '.object.sha' <<<"${old_ref_json}")"
          if [[ "${new_sha}" != "${old_sha}" ]]; then
            echo "::error::Tag targets differ: ${NEW_TAG}=${new_sha}, ${OLD_TAG}=${old_sha}. Refusing deletion."
            exit 1
          fi

          release_json="$(curl --fail-with-body -sS "${auth[@]}" "${api}/releases/${RELEASE_ID}")"
          release_tag="$(jq -r '.tag_name' <<<"${release_json}")"
          if [[ "${release_tag}" != "${NEW_TAG}" ]]; then
            echo "::error::Release is not attached to ${NEW_TAG}; refusing deletion."
            exit 1
          fi

          echo "Read and preserve the active tag-protection ruleset."
          ruleset_json="$(curl --fail-with-body -sS "${admin_auth[@]}" "${api}/rulesets/${RULESET_ID}")"
          original_payload="$(jq '{name,target,enforcement,bypass_actors,conditions,rules}' <<<"${ruleset_json}")"
          temporary_payload="$(jq --arg old "refs/tags/${OLD_TAG}" '{name,target,enforcement,bypass_actors,conditions,rules} | .conditions.ref_name.exclude = ((.conditions.ref_name.exclude // []) + [$old] | unique)' <<<"${ruleset_json}")"

          restore_ruleset() {
            echo "Restore original tag-protection ruleset."
            curl --fail-with-body -sS "${admin_auth[@]}" -X PUT "${api}/rulesets/${RULESET_ID}" -d "${original_payload}" >/tmp/ruleset-restored.json
          }
          trap restore_ruleset EXIT

          echo "Temporarily exclude only refs/tags/${OLD_TAG} from deletion protection."
          curl --fail-with-body -sS "${admin_auth[@]}" -X PUT "${api}/rulesets/${RULESET_ID}" -d "${temporary_payload}" >/tmp/ruleset-temp.json
          temp_exclude="$(jq -r '.conditions.ref_name.exclude[]?' /tmp/ruleset-temp.json | grep -Fx "refs/tags/${OLD_TAG}" || true)"
          if [[ "${temp_exclude}" != "refs/tags/${OLD_TAG}" ]]; then
            echo "::error::Temporary ruleset exclusion was not applied."
            exit 1
          fi

          echo "Delete obsolete ${OLD_TAG}."
          curl --fail-with-body -sS "${auth[@]}" -X DELETE "${api}/git/refs/tags/${OLD_TAG}" >/dev/null

          old_status="$(curl -sS -o /tmp/old-final.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/tags/${OLD_TAG}")"
          if [[ "${old_status}" != "404" ]]; then
            echo "::error::${OLD_TAG} still exists after delete attempt; status=${old_status}."
            exit 1
          fi

          restore_ruleset
          trap - EXIT

          echo "Final verification."
          final_ruleset="$(curl --fail-with-body -sS "${admin_auth[@]}" "${api}/rulesets/${RULESET_ID}")"
          restored_old_exclusion="$(jq -r --arg old "refs/tags/${OLD_TAG}" '(.conditions.ref_name.exclude // []) | index($old)' <<<"${final_ruleset}")"
          if [[ "${restored_old_exclusion}" != "null" ]]; then
            echo "::error::Ruleset restore verification failed; temporary exclusion remains."
            exit 1
          fi

          final_ref="$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${NEW_TAG}")"
          final_sha="$(jq -r '.object.sha' <<<"${final_ref}")"
          final_release="$(curl --fail-with-body -sS "${auth[@]}" "${api}/releases/${RELEASE_ID}")"
          final_tag="$(jq -r '.tag_name' <<<"${final_release}")"
          if [[ "${final_sha}" != "${old_sha}" || "${final_tag}" != "${NEW_TAG}" ]]; then
            echo "::error::Canonical release verification failed."
            exit 1
          fi

          echo "Release reconciliation complete: ${NEW_TAG} -> ${final_sha}; ${OLD_TAG} removed; tag protection restored."
