name: Reconcile Release Tag Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-release-tag-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    name: Retag v0.1.3 release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reconcile tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: '370129888'
          OLD_TAG: 'v2'
          NEW_TAG: 'v0.1.3'
          RELEASE_NAME: 'Bangladesh MPO School & College Salary Tax Toolkit v0.1.3 Beta'
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "Resolve the existing ${OLD_TAG} target commit."
          old_ref_json="$(curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${OLD_TAG}")"
          old_sha="$(jq -r '.object.sha' <<<"${old_ref_json}")"
          echo "Existing ${OLD_TAG} target: ${old_sha}"

          echo "Create ${NEW_TAG} at the exact same commit if it does not already exist."
          status="$(curl -sS -o /tmp/new-ref.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/tags/${NEW_TAG}")"
          if [[ "${status}" == "404" ]]; then
            payload="$(jq -nc --arg ref "refs/tags/${NEW_TAG}" --arg sha "${old_sha}" '{ref:$ref,sha:$sha}')"
            curl --fail-with-body -sS "${auth[@]}" -X POST "${api}/git/refs" -d "${payload}" >/tmp/create-ref.json
          elif [[ "${status}" == "200" ]]; then
            existing_sha="$(jq -r '.object.sha' /tmp/new-ref.json)"
            if [[ "${existing_sha}" != "${old_sha}" ]]; then
              echo "::error::${NEW_TAG} already exists at ${existing_sha}, expected ${old_sha}. Refusing to overwrite."
              exit 1
            fi
          else
            cat /tmp/new-ref.json
            echo "::error::Unexpected HTTP status while checking ${NEW_TAG}: ${status}"
            exit 1
          fi

          echo "Retarget the existing GitHub Release to ${NEW_TAG}."
          release_payload="$(jq -nc --arg tag "${NEW_TAG}" --arg name "${RELEASE_NAME}" '{tag_name:$tag,target_commitish:"main",name:$name,draft:false,prerelease:false}')"
          curl --fail-with-body -sS "${auth[@]}" -X PATCH "${api}/releases/${RELEASE_ID}" -d "${release_payload}" >/tmp/release.json
          release_tag="$(jq -r '.tag_name' /tmp/release.json)"
          if [[ "${release_tag}" != "${NEW_TAG}" ]]; then
            echo "::error::Release retag failed; release reports ${release_tag}."
            exit 1
          fi

          echo "Delete obsolete ${OLD_TAG} only after the release points to ${NEW_TAG}."
          curl --fail-with-body -sS "${auth[@]}" -X DELETE "${api}/git/refs/tags/${OLD_TAG}" >/dev/null

          echo "Final verification."
          curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${NEW_TAG}" >/tmp/final-ref.json
          curl --fail-with-body -sS "${auth[@]}" "${api}/releases/${RELEASE_ID}" >/tmp/final-release.json
          final_sha="$(jq -r '.object.sha' /tmp/final-ref.json)"
          final_tag="$(jq -r '.tag_name' /tmp/final-release.json)"

          old_status="$(curl -sS -o /tmp/old-final.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/tags/${OLD_TAG}")"
          if [[ "${final_sha}" != "${old_sha}" || "${final_tag}" != "${NEW_TAG}" || "${old_status}" != "404" ]]; then
            echo "::error::Final verification failed. final_sha=${final_sha}, final_tag=${final_tag}, old_status=${old_status}"
            exit 1
          fi

          echo "Release reconciliation complete: ${NEW_TAG} -> ${final_sha}; ${OLD_TAG} removed."
