name: Repository Maintenance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: repository-maintenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject temporary release filenames
        shell: bash
        run: |
          set -euo pipefail

          invalid_files="$({
            find excel assets releases -type f 2>/dev/null || true
          } | grep -Ei '(^|[/_. -])(final|new|copy|latest|updated)([/_. -]|$)' || true)"

          if [[ -n "$invalid_files" ]]; then
            echo "::error::Temporary or ambiguous release asset filenames detected:"
            printf '%s\n' "$invalid_files"
            exit 1
          fi

      - name: Validate tracked filenames
        shell: bash
        run: |
          set -euo pipefail

          invalid_paths="$(
            git ls-files \
              | grep -E '(^|/)[^/]*\([0-9]+\)[^/]*$' \
              || true
          )"

          if [[ -n "$invalid_paths" ]]; then
            echo "::error::Duplicate-style filenames detected:"
            printf '%s\n' "$invalid_paths"
            exit 1
          fi

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

  todo-audit:
    name: TODO Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Report actionable TODO comments
        shell: bash
        run: |
          set -euo pipefail

          matches="$(
            git grep -nEI \
              '(TODO|FIXME|BUG|HACK):[[:space:]].{10,}' \
              -- \
              '*.py' '*.sh' '*.ps1' '*.js' '*.ts' \
              '*.yml' '*.yaml' \
              ':!docs/**' \
              ':!wiki/**' \
              || true
          )"

          if [[ -z "$matches" ]]; then
            echo "No actionable TODO comments found."
            exit 0
          fi

          {
            echo "## TODO audit"
            echo
            echo '```text'
            printf '%s\n' "$matches"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
