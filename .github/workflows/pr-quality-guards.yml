name: PR Quality Guards

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  duplicate-guard:
    name: Duplicate Guard
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect unintentionally duplicated files
        uses: chris-rutkowski/duplicate-guard@01e2af7b15e45e2ef66d65786a0b73855232748f # v1.0.2

  commit-message-validator:
    name: Commit Message Validator
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin "${BASE_SHA}" "${HEAD_SHA}"

          allowed_types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          pattern="^(${allowed_types})(\\([a-z0-9][a-z0-9._/-]*\\))?!?: .+"
          invalid=0

          while IFS= read -r subject; do
            [[ -n "${subject}" ]] || continue

            # GitHub-generated merge and revert subjects are accepted.
            if [[ "${subject}" =~ ^Merge\  ]] || [[ "${subject}" =~ ^Revert\  ]]; then
              continue
            fi

            if [[ ! "${subject}" =~ ${pattern} ]]; then
              echo "::error::Invalid commit subject: ${subject}"
              echo "Expected: type(optional-scope): description"
              echo "Allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
              invalid=1
            fi
          done < <(git log --format='%s' "${BASE_SHA}..${HEAD_SHA}")

          if (( invalid != 0 )); then
            exit 1
          fi
