name: Documentation Integrity

on:
  pull_request:
    paths:
      - "wiki/**"
      - "docs/**"
      - "scripts/validate_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "docs/**"
      - "scripts/validate_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation integrity
        run: python scripts/validate_docs_integrity.py
