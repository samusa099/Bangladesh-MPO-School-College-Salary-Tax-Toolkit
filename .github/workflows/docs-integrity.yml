name: Documentation Integrity

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate documentation integrity
        run: python scripts/validate_docs_integrity.py
