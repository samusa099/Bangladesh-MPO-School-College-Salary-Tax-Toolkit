name: PR Governance Actions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-governance-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Governance checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject changed files larger than 25 MiB
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_BYTES: "26214400"
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin "$BASE_SHA" || true

          oversized=0
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            size=$(stat -c '%s' -- "$file")
            if (( size > MAX_BYTES )); then
              printf '::error file=%s::File is %s bytes; maximum allowed size is %s bytes.\n' \
                "$file" "$size" "$MAX_BYTES"
              oversized=1
            fi
          done < <(git diff --name-only --diff-filter=AM -z "$BASE_SHA" "$HEAD_SHA")

          if (( oversized != 0 )); then
            exit 1
          fi

      - id: cfg
        name: Detect optional integrations
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONTARA_WEBHOOK_URL: ${{ secrets.MONTARA_WEBHOOK_URL }}
          SKILL_NAME: ${{ vars.SKILL_NAME }}
          SKILL_PATH: ${{ vars.SKILL_PATH }}
        run: |
          set -euo pipefail
          [[ -f .reviewers.yaml ]] && echo 'reviewers=1' >> "$GITHUB_OUTPUT" || true
          [[ -f .github/auto-label.json ]] && echo 'labels=1' >> "$GITHUB_OUTPUT" || true
          [[ -n "$ANTHROPIC_API_KEY" && -n "$SKILL_NAME" && -n "$SKILL_PATH" && -d "$SKILL_PATH" ]] \
            && echo 'skill_eval=1' >> "$GITHUB_OUTPUT" || true
          [[ -n "$MONTARA_WEBHOOK_URL" ]] && echo 'montara=1' >> "$GITHUB_OUTPUT" || true

      - name: PR Reviewers Action
        if: steps.cfg.outputs.reviewers == '1'
        uses: patricklubach/reviewer-action@08ac0b7c9afeb55739d2a8c6c8180bebf7874cde # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}

      - name: Auto Label Action
        if: steps.cfg.outputs.labels == '1'
        uses: banyan/auto-label@45a96386f4cac601434ed0f34db11c8df2fcac86 # 1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skill Eval
        if: steps.cfg.outputs.skill_eval == '1'
        uses: skill-bench/skill-eval-action@32cb44e77cf3147ebbe140a953065e0ac89eddb6 # v1.3.0
        with:
          skill-name: ${{ vars.SKILL_NAME }}
          skill-path: ${{ vars.SKILL_PATH }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Montara CI
        if: steps.cfg.outputs.montara == '1'
        uses: montara-io/montara-ci@eca5afc53f2e39c847d187e4bf43b1bef9e1056e # v1.0.20
        with:
          webhookUrl: ${{ secrets.MONTARA_WEBHOOK_URL }}
