<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Bangladesh MPO Payroll and Tax Excel Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.52" stop-color="#12324A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <circle cx="1390" cy="55" r="180" fill="#22C55E" opacity="0.10"/>
  <circle cx="1450" cy="360" r="230" fill="#60A5FA" opacity="0.08"/>
  <circle cx="105" cy="365" r="210" fill="#FBBF24" opacity="0.08"/>
  <rect x="84" y="70" width="1432" height="280" rx="34" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18" filter="url(#shadow)"/>
  <text x="130" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#A7F3D0" letter-spacing="2.5">OPEN-SOURCE BANGLADESH PAYROLL TOOLKIT</text>
  <text x="130" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">Bangladesh MPO Salary &amp; Tax Toolkit</text>
  <text x="130" y="238" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#D7E7F3">School &amp; College MPO payroll, annual salary statement, tax estimate, payslip and dashboard</text>
  <g transform="translate(130 282)">
    <rect x="0" y="0" width="205" height="42" rx="21" fill="#DCFCE7" opacity="0.95"/>
