    <rect x="230" y="0" width="170" height="42" rx="21" fill="#DBEAFE" opacity="0.95"/>
    <text x="252" y="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#1D4ED8">No VBA v1</text>
    <rect x="425" y="0" width="220" height="42" rx="21" fill="#FEF3C7" opacity="0.95"/>
    <text x="447" y="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#92400E">Source-linked rules</text>
    <rect x="670" y="0" width="195" height="42" rx="21" fill="#FCE7F3" opacity="0.95"/>
    <text x="692" y="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#9D174D">TY 2026–27</text>
