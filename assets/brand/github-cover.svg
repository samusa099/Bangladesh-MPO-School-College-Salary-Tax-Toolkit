    <rect x="28" y="108" width="112" height="18" rx="5" fill="#E2E8F0"/>
    <rect x="160" y="108" width="112" height="18" rx="5" fill="#E2E8F0"/>
    <rect x="28" y="146" width="244" height="18" rx="5" fill="#BBF7D0"/>
